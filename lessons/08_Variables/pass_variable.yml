---
- name: Pass variable from one play to the next in a playbook
  hosts: host1
  gather_facts: false
  vars:
    my_play_var: "play var value"

  tasks:

    - name: Declare fact
      ansible.builtin.set_fact:
        my_fact: "fact value"

    - name: Debug variable
      ansible.builtin.debug:
        var: my_play_var

    - name: Debug fact
      ansible.builtin.debug:
        var: my_fact

- name: Next play uses same facts and variables
  hosts: all
  gather_facts: false

  tasks:

    - name: Debug variable
      ansible.builtin.debug:
        var: my_play_var

    - name: Debug fact
      ansible.builtin.debug:
        var: my_fact

    - name: Debug hostvars
      ansible.builtin.debug:
        var: hostvars['host1']['my_fact']

    - name: Debug host facts
      ansible.builtin.debug:
        var: hostvars['host1']['ansible_default_ipv4']

    - name: Gather host facts
      ansible.builtin.setup:
      
    - name: Debug host facts
      ansible.builtin.debug:
        var: hostvars['host1']['ansible_default_ipv4']
