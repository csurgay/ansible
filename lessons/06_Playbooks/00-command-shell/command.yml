# Usage of the command module: run a single command, no shell features
---
- name: Check uptime
  hosts: all
  become: false
  gather_facts: false

  tasks:

    - name: Uptime
      ansible.builtin.command: uptime
      register: result_uptime

    - name: Print result
      ansible.builtin.debug:
        var: result_uptime.stdout_lines
