---
- name: Fetch CMDB configuration
  hosts: controlnode
  become: true
  gather_facts: false
  vars:
    cmdb_repo: https://github.com/csurgay/cmdb.git
    cmdb_dest: /tmp/cmdb

  tasks:
    - name: Clone CMDB repository
      ansible.builtin.git:
        repo: "{{ cmdb_repo }}"
        dest: "{{ cmdb_dest }}"
        version: main
        force: true

    - name: Load variables from cloned vars.yml
      ansible.builtin.include_vars:
        file: "{{ cmdb_dest }}/vars.yml"
        name: cmdb

    - name: Debug CMDB data
      ansible.builtin.debug:
        var: cmdb.data

- name: Other play to install services
  hosts: host*
  become: true
  gather_facts: false
  
  tasks:

    - name: Install and start webserver package
      ansible.builtin.include_tasks: "service.yml"
      with_items: "{{ hostvars['controlnode']['cmdb'].data }}"
      when: inventory_hostname != "controlnode"

    - name: Test all hosts webservers
      ansible.builtin.uri:
        url: http://{{ ansible_host }}
        status_code: 200
      register: result_webtest
      when: inventory_hostname != "controlnode"

    - name: Debug webtest
      ansible.builtin.debug:
        var: result_webtest.server
      when: inventory_hostname != "controlnode"

