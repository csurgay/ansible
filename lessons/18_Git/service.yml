---
- name: Stop all 80 binding webservices
  ansible.builtin.systemd:
    name: "{{ loopvar }}"
    state: stopped
  with_items:
    - httpd
    - nginx
    - lighttpd
    - haproxy
  loop_control:
    loop_var: loopvar
  when: ansible_host == item.hostname
  ignore_errors: true

- name: Debug item value
  ansible.builtin.debug:
    var: item
  when: ansible_host == item.hostname

- name: Install webserver package
  ansible.builtin.package:
    name: "{{ item.webserver }}"
    state: latest
  when: ansible_host == item.hostname

- name: Ensure webserver service is running and enabled
  ansible.builtin.systemd:
    name: "{{ item.webserver }}"
    state: restarted
    enabled: true
  when: ansible_host == item.hostname

