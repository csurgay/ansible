---
- name: Create three local users on all servers
  hosts: myhosts
  gather_facts: false
  become: true
  vars_files:
    - "passwords.yml"

  vars:
    users_to_create:

      - name: "alice"
        pwd: "{{ pwd_alice }}"
        comment: "Alice User"
        shell: "/bin/bash"
        home: "/home/alice"

      - name: "bob"
        pwd: "{{ pwd_bob }}"
        comment: "Bob User"
        shell: "/bin/bash"
        home: "/home/bob"

      - name: "charlie"
        pwd: "{{ pwd_charlie }}"
        comment: "Charlie User"
        shell: "/bin/bash"
        home: "/home/charlie"

  tasks:

    - name: Create local users
      ansible.builtin.user:
        name: "{{ item.name }}"
        password: "{{ item.pwd | password_hash('sha512') }}"
        update_password: on_create
        comment: "{{ item.comment }}"
        shell: "{{ item.shell }}"
        home: "{{ item.home }}"
        create_home: true
        state: present
      loop: "{{ users_to_create }}"
      loop_control:
        label: "{{ item.name }}"
      register: result_users

    - name: Force password change at first login (only for newly created users)
      ansible.builtin.command:
        cmd: "chage -d 0 {{ item.item.name }}"
      loop: "{{ result_users.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item is changed
