[defaults]
inventory = ./host_inventory
log_path = ./ansible.log
callback_result_format = yaml
# network devices use passwords (or ask for it / put it in Vault, see README)
ask_pass = true
# lab / sandbox only: do not verify the device's SSH host key
host_key_checking = false

[persistent_connection]
# seconds to wait for a slow device to answer a command
command_timeout = 60
