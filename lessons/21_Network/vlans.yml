---
- name: VLANs and access ports with resource modules
  hosts: switches
  gather_facts: false

  tasks:
    - name: Make sure the VLANs exist (other VLANs are left alone)
      cisco.ios.ios_vlans:
        config:
          - vlan_id: 10
            name: USERS
          - vlan_id: 20
            name: SERVERS
        state: merged

    - name: Put two ports into the VLANs as access ports
      cisco.ios.ios_l2_interfaces:
        config:
          - name: GigabitEthernet0/1
            mode: access
            access:
              vlan: 10
          - name: GigabitEthernet0/2
            mode: access
            access:
              vlan: 20
        state: merged

    - name: Read the VLANs back as structured data
      cisco.ios.ios_vlans:
        state: gathered
      register: vlans

    - name: Show them
      ansible.builtin.debug:
        msg: "{{ vlans.gathered | map(attribute='vlan_id') | list }}"
